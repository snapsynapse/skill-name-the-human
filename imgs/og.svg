<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<defs>
  <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0%" stop-color="#141B29"/>
    <stop offset="55%" stop-color="#18202F"/>
    <stop offset="100%" stop-color="#22304A"/>
  </linearGradient>
</defs>
<style>
  .f { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .wm { font-size: 38px; font-weight: 700; fill: #FFFFFF; letter-spacing: -0.4px; }
  .h  { font-size: 54px; font-weight: 700; fill: #FFFFFF; letter-spacing: -1.2px; }
  .s  { font-size: 25px; font-weight: 400; fill: #94A3B8; }
  .p  { font-size: 17px; font-weight: 400; fill: #B6C2D2; }
  .th { font-size: 13px; font-weight: 500; fill: #8C9AAC; }
  .lb { font-size: 12px; font-weight: 700; fill: #1B2233; letter-spacing: 0.7px; }
  .pill { font-size: 13px; font-weight: 600; fill: #2A2113; }
  .cr { font-size: 21px; font-weight: 600; fill: #FFFFFF; }
  .crs { font-size: 16px; font-weight: 400; fill: #8C9AAC; }
</style>
<rect width="1200" height="630" fill="url(#bg)"/>

<!-- glyph -->
<rect x="62" y="60" width="72" height="72" rx="18" fill="#222C3E"/>
<rect x="80" y="78" width="4" height="36" rx="2" fill="#E0A33E"/>
<rect x="89" y="80" width="14" height="6" rx="2.5" fill="#E0A33E"/>
<rect x="89" y="93" width="10" height="6" rx="2.5" fill="#E0A33E"/>
<rect x="89" y="106" width="14" height="6" rx="2.5" fill="#E0A33E"/>
<rect x="108" y="79" width="14" height="9" rx="2.5" fill="none" stroke="#6B7A8E" stroke-width="1.6"/>
<rect x="108" y="92" width="14" height="9" rx="2.5" fill="none" stroke="#6B7A8E" stroke-width="1.6"/>
<rect x="108" y="105" width="14" height="9" rx="2.5" fill="none" stroke="#6B7A8E" stroke-width="1.6"/>
<text class="f wm" x="152" y="106">Name the Human</text>

<!-- headline -->
<text class="f h" x="62" y="268">If this is wrong,</text>
<text class="f h" x="62" y="330">whose name is on it?</text>

<!-- subtitle -->
<text class="f s" x="62" y="392">An accountability inventory for everything</text>
<text class="f s" x="62" y="426">that acts without a human deciding first.</text>

<!-- pills -->
<rect x="62"  y="478" width="186" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.14"/>
<text class="f p" x="155" y="503" text-anchor="middle">4 location classes</text>
<rect x="260" y="478" width="128" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.14"/>
<text class="f p" x="324" y="503" text-anchor="middle">9 columns</text>
<rect x="400" y="478" width="258" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.14"/>
<text class="f p" x="529" y="503" text-anchor="middle">5 the machine may never fill</text>

<!-- card -->
<rect x="690" y="132" width="450" height="356" rx="14" fill="#1E293B" stroke="#334155"/>

<!-- label -->
<rect x="938" y="150" width="184" height="24" rx="6" fill="#E0A33E"/>
<text class="f lb" x="1030" y="166.5" text-anchor="middle">A HUMAN FILLS THESE</text>

<!-- headers: machine side -->
<text class="f th" x="716" y="208">Surface</text>
<text class="f th" x="806" y="208">Reach</text>
<text class="f th" x="864" y="208">Detection</text>
<!-- headers: human side -->
<text class="f th" x="944" y="208">Accountable</text>
<text class="f th" x="1030" y="208">Fallback</text>
<text class="f th" x="1096" y="208">Verdict</text>
<line x1="710" y1="220" x2="1120" y2="220" stroke="#3A4757"/>

<!-- THE DIVIDER: immediately left of Accountable -->
<line x1="932" y1="184" x2="932" y2="468" stroke="#E0A33E" stroke-width="2" stroke-opacity="0.85"/>

<!-- row 1 -->
<rect x="716" y="246" width="74" height="9" rx="4.5" fill="#FFFFFF"/>
<rect x="716" y="261" width="46" height="8" rx="4" fill="#64748B"/>
<rect x="800" y="248" width="44" height="18" rx="9" fill="#E0A33E"/>
<text class="f pill" x="822" y="261" text-anchor="middle">wide</text>
<rect x="862" y="248" width="56" height="18" rx="9" fill="#E0A33E"/>
<text class="f pill" x="890" y="261" text-anchor="middle">nobody</text>
<rect x="940" y="244" width="72" height="26" rx="5" fill="none" stroke="#475569"/>
<rect x="1022" y="244" width="58" height="26" rx="5" fill="none" stroke="#475569"/>
<rect x="1088" y="244" width="34" height="26" rx="5" fill="none" stroke="#475569"/>

<!-- row 2 -->
<rect x="716" y="300" width="60" height="9" rx="4.5" fill="#FFFFFF"/>
<rect x="716" y="315" width="38" height="8" rx="4" fill="#64748B"/>
<rect x="800" y="302" width="44" height="18" rx="9" fill="#E0A33E"/>
<text class="f pill" x="822" y="315" text-anchor="middle">wide</text>
<rect x="862" y="304" width="48" height="9" rx="4.5" fill="#FFFFFF"/>
<rect x="940" y="298" width="72" height="26" rx="5" fill="none" stroke="#475569"/>
<rect x="1022" y="298" width="58" height="26" rx="5" fill="none" stroke="#475569"/>
<rect x="1088" y="298" width="34" height="26" rx="5" fill="none" stroke="#475569"/>

<!-- row 3 -->
<rect x="716" y="354" width="82" height="9" rx="4.5" fill="#FFFFFF"/>
<rect x="716" y="369" width="50" height="8" rx="4" fill="#64748B"/>
<rect x="800" y="358" width="40" height="9" rx="4.5" fill="#CBD5E1"/>
<rect x="862" y="358" width="54" height="9" rx="4.5" fill="#64748B"/>
<rect x="940" y="352" width="72" height="26" rx="5" fill="none" stroke="#475569"/>
<rect x="1022" y="352" width="58" height="26" rx="5" fill="none" stroke="#475569"/>
<rect x="1088" y="352" width="34" height="26" rx="5" fill="none" stroke="#475569"/>

<!-- row 4 -->
<rect x="716" y="408" width="68" height="9" rx="4.5" fill="#FFFFFF"/>
<rect x="716" y="423" width="42" height="8" rx="4" fill="#64748B"/>
<rect x="800" y="410" width="56" height="18" rx="9" fill="#E0A33E"/>
<text class="f pill" x="828" y="423" text-anchor="middle">nobody</text>
<rect x="862" y="412" width="44" height="9" rx="4.5" fill="#64748B"/>
<rect x="940" y="406" width="72" height="26" rx="5" fill="none" stroke="#475569"/>
<rect x="1022" y="406" width="58" height="26" rx="5" fill="none" stroke="#475569"/>
<rect x="1088" y="406" width="34" height="26" rx="5" fill="none" stroke="#475569"/>

<!-- credit -->
<text class="f cr" x="600" y="562" text-anchor="middle">sigsub.show/takeaways/name-the-human</text>
<text class="f crs" x="600" y="592" text-anchor="middle">a Signals &amp; Subtractions resource by Snap Synapse</text>
