bundle: name-the-human
bundle_version: 0.1.0
bundle_date: 2026-09-15
description: >
  Deployer-side accountability inventory for automated and AI systems. A
  read-only harvest over four location classes, a model judge that must cite
  its evidence, a human-only naming pass, and a validator that recomputes the
  totals. Schema name-the-human/v0.3.
frontmatter_mode: minimal

compatibility:
  node: ">=22"
  designed_for:
    platform: Portable skill bundle (Claude Code, Codex)
    surface: Code
  tested_on:
    - platform: Anthropic Claude
      model: Claude Fable 5.1
      surface: Code
      status: pass
      date: 2026-09-15
      skill_version: 1
      notes: >
        Built and self-tested on the author's macOS estate. Fixture suite
        passes; harvest run twice over the real estate with identical ids.
    - platform: OpenAI Codex
      surface: Code
      status: partial
      date: 2026-09-15
      skill_version: 1
      notes: >
        The v0.2 prompt was run through Codex (GPT 5.6 Terra Light) on
        2026-09-15 against the same estate and produced seventeen surfaces
        (GitHub Actions and Vercel only; it missed launchd agents and hooks).
        That run motivated every schema v0.3 delta. The v0.3 bundle itself
        has not yet been exercised from Codex.

deployments: []

